# Bench wiring for the FRANK Core 2 Proto Linux port.
#
# Instruments are addressed by USB serial number, never by /dev node or
# enumeration order: tty names derive from the USB location ID and move when a
# device is replugged into a different hub port, and with two identical-protocol
# CMSIS-DAP probes attached, "the first one" is not a stable identity.
#
# The tty node for each probe is discovered at run time by tools/devices.py --
# do not record it here, it will go stale.
#
# Probes seen on this bench:
#   E6616407E335BB29  "Debug Probe _CMSIS_DAP_"        official RPi Debug Probe
#   E6635C08CB46BB26  "Debugprobe on Pico _CMSIS_DAP_" Pico running debugprobe
#
# MASTER = RP2350B (U3), SWD header J1.  Carries HDMI J5, USB-C J8, microSD J7.
# SLAVE  = RP2350A (U6), SWD header J3.  Runs Linux.  UART console on J4.
#
# Swap these two values if the probes are moved between J1 and J3. Getting them
# backwards flashes the wrong half, which openocd cannot detect for you: both
# targets are RP2350 and both answer identically over SWD.

MASTER_PROBE_SERIAL=E6616407E335BB29
SLAVE_PROBE_SERIAL=E6635C08CB46BB26

# HDMI capture. avfoundation addresses devices by name or index, and indices
# renumber whenever any camera is attached or removed, so always match by name.
# Native 640x480@60 is offered, which is exactly the HSTX output mode -- capture
# at that size and the frame is pixel-exact with no rescale.
CAPTURE_VIDEO_DEVICE=USB Video
CAPTURE_AUDIO_DEVICE=USB Digital Audio
CAPTURE_SIZE=640x480
CAPTURE_FPS=60

# Slave debug console. UART1 on GPIO24/25 (header J4) -- GPIO0, where the SDK
# would put uart0 TX, is the PSRAM chip select on that half.
SLAVE_CONSOLE_BAUD=115200
MASTER_CONSOLE_BAUD=115200
